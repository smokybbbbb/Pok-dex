<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<header>
  <p class="logo">National Pokédex</p>
  <h1>Pokédex</h1>
</header>

<div class="search-wrap">
  <input type="text" id="search" placeholder="Search Pokémon..." autocomplete="off" spellcheck="false" />
  <p class="search-hint">Search by name or number</p>
</div>

<div class="filter-wrap">
  <div class="filter-bar" id="filter-bar">
    <button class="filter-chip active" data-type="all" style="background:#1a1a1a;border-color:#1a1a1a">All</button>
    <button class="filter-chip" data-type="normal">Normal</button>
    <button class="filter-chip" data-type="fire">Fire</button>
    <button class="filter-chip" data-type="water">Water</button>
    <button class="filter-chip" data-type="electric">Electric</button>
    <button class="filter-chip" data-type="grass">Grass</button>
    <button class="filter-chip" data-type="ice">Ice</button>
    <button class="filter-chip" data-type="fighting">Fighting</button>
    <button class="filter-chip" data-type="poison">Poison</button>
    <button class="filter-chip" data-type="ground">Ground</button>
    <button class="filter-chip" data-type="flying">Flying</button>
    <button class="filter-chip" data-type="psychic">Psychic</button>
    <button class="filter-chip" data-type="bug">Bug</button>
    <button class="filter-chip" data-type="rock">Rock</button>
    <button class="filter-chip" data-type="ghost">Ghost</button>
    <button class="filter-chip" data-type="dragon">Dragon</button>
    <button class="filter-chip" data-type="dark">Dark</button>
    <button class="filter-chip" data-type="steel">Steel</button>
    <button class="filter-chip" data-type="fairy">Fairy</button>
  </div>
</div>

<div id="content">
  <div class="loader-wrap"><div class="spinner"></div></div>
</div>

<button class="go-top" id="go-top" aria-label="Go to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="config/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
